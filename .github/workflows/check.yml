name: Integración Continua y Verificación Física

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verificación Analítica, Linter LaTeX, SVG, KaTeX y Mutación

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 1. Ejecutar Linter de Sintaxis y Escapes LaTeX
        run: |
          python scripts/lint_latex.py

      - name: 2. Validar Calidad y Formato de Figuras SVG (< 120 KB, XML, sin URLs)
        run: |
          python scripts/check_figures.py
          python -c "import json, glob, sys; exp = json.load(open('scripts/esperados.json', encoding='utf-8')); actual = len(glob.glob('img/*.svg')); expected = exp['figuras_svg_total']; print(f'Figuras SVG obtenidas: {actual} / esperadas: {expected}'); sys.exit(0 if actual == expected else 1)"

      - name: 3. Ejecutar Verificación Analítica SymPy y Validar Conteo Exacto
        run: |
          python scripts/verificar.py > scripts/salida_verificar.txt
          cat scripts/salida_verificar.txt
          python -c "import json, sys; exp = json.load(open('scripts/esperados.json', encoding='utf-8')); actual = open('scripts/salida_verificar.txt', encoding='utf-8').read().count('[PASS]'); expected = exp['verificar_sympy_pass']; print(f'Pruebas analíticas pasadas: {actual} / esperadas: {expected}'); sys.exit(0 if actual == expected else 1)"

      - name: 4. Ejecutar Verificación de Consistencia Numérica
        run: |
          python scripts/verificar_numericos.py
          python -c "import json, sys; sys.path.insert(0, '.'); from scripts.verificar_numericos import NUMERICAL_REGISTRY; exp = json.load(open('scripts/esperados.json', encoding='utf-8')); actual = len(NUMERICAL_REGISTRY); expected = exp['ejercicios_numericos_total']; print(f'Ejercicios numéricos: {actual} / esperados: {expected}'); sys.exit(0 if actual == expected else 1)"

      - name: 5. Ejecutar Suite de Pruebas de Mutación
        run: |
          python scripts/test_mutacion.py

      - name: 6. Iniciar Servidor HTTP Local
        run: |
          python -m http.server 8080 &
          sleep 2

      - name: 7. Ejecutar Auditoría KaTeX y DOM en Navegador (Playwright Headless)
        run: |
          python scripts/verify_browser_katex.py --port 8080

      - name: 8. Generar Tabla Resumen Automatizada en NOTAS_REVISION.md
        run: |
          python scripts/generar_resumen.py

      - name: 9. Subir Reportes de Verificación como Artefactos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-verificacion
          path: |
            scripts/salida_verificar.txt
            scripts/salida_figuras.txt
            scripts/reporte_browser.json
